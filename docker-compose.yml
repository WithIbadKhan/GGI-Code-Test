services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ggi
      POSTGRES_PASSWORD: ggi_local_password
      POSTGRES_DB: ggi
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate `ggi_test` database used by integration tests.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ggi -d ggi']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
